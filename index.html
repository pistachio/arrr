<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Voice Ipsum | Zen Mode</title>
    
    <!-- The Ice Cream Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍦</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text-dark: #141413; --text-light: #faf9f5;
            --bg-light: #faf9f5; --bg-dark: #141413;
            --secondary: #8e8c84; --subtle-bg: #e8e6dc;
            --accent-orange: #d97757; --accent-blue: #6a9bcc;
            --accent-green: #788c5d; 
            --current-bg: var(--bg-light); --current-text: var(--text-dark);
            --border: var(--subtle-bg); --dock-bg: rgba(255, 255, 255, 0.85);
            --input-bg: rgba(0,0,0,0.02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --current-bg: var(--bg-dark); --current-text: var(--text-light);
                --border: #3d3d3b; --dock-bg: rgba(28, 28, 27, 0.85);
                --input-bg: rgba(255,255,255,0.05);
            }
        }

        html, body {
            height: 100%; overflow: hidden; background-color: var(--current-bg);
            font-family: 'Lora', Georgia, serif; color: var(--current-text); font-size: 16px;
        }

        /* Top Navigation (Minimalist) */
        #top-bar {
            position: fixed; top: 0; left: 0; right: 0; min-height: 60px;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 32px; z-index: 100; pointer-events: none;
        }

        .brand-title {
            font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.1rem;
            color: var(--secondary); letter-spacing: 0.15em;
            pointer-events: auto;
        }

        /* The Reading Canvas */
        #app { 
            display: flex; justify-content: center; 
            height: 100vh; padding: 100px 24px 180px 24px; 
        }
        
        #out {
            width: 100%; max-width: 760px; height: 100%; overflow-y: auto;
            font-size: 1.35rem; line-height: 1.8; color: var(--current-text);
            white-space: pre-wrap; overflow-wrap: break-word;
            scrollbar-width: none; /* Hide scrollbar for zen feel */
        }
        #out::-webkit-scrollbar { display: none; }

        /* The Unified Command Dock */
        #control-dock {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            background: var(--dock-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 20px 32px; border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0,0,0,0.08); z-index: 100;
            width: 90%; max-width: 900px;
        }

        #nav-controls {
            display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; justify-content: center;
            width: 100%;
        }

        .control-group {
            display: flex; flex-direction: column; gap: 6px;
        }

        .control-group label {
            font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.65rem;
            text-transform: uppercase; letter-spacing: 0.08em; color: var(--secondary);
        }

        /* Enhanced Zen Inputs */
        select, input[type="number"] {
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 500;
            background: var(--input-bg); color: var(--current-text);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 12px; outline: none; cursor: pointer;
            transition: all 0.2s ease;
        }
        select:hover, input[type="number"]:hover { border-color: var(--secondary); }
        select:focus, input[type="number"]:focus { 
            border-color: var(--accent-orange); 
            box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.15); 
        }
        
        select option { background: var(--current-bg); color: var(--current-text); }
        input[type="number"] { width: 70px; }

        .check-row {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            font-family: 'Poppins', sans-serif; font-size: 0.8rem; font-weight: 500;
            color: var(--current-text); padding-bottom: 8px;
            max-width: 300px;
        }
        .check-row input { accent-color: var(--accent-orange); width: 16px; height: 16px; cursor: pointer; }
        .check-row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .divider {
            width: 100%; height: 1px; background: var(--border); margin: 4px 0;
        }

        .action-row {
            display: flex; gap: 16px; align-items: center; justify-content: center; width: 100%;
        }

        /* Buttons */
        .btn {
            color: #fff; border-radius: 12px; border: none; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
            font-family: 'Poppins', sans-serif; font-weight: 600; gap: 8px;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-main { 
            padding: 12px 24px; background: var(--accent-orange); font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(217, 119, 87, 0.3);
        }
        .btn-main:hover { background: #c9694b; box-shadow: 0 6px 16px rgba(217, 119, 87, 0.4); }
        
        .btn-sm { 
            width: 44px; height: 44px; background: var(--input-bg); 
            color: var(--current-text); border: 1px solid var(--border);
        }
        .btn-sm:hover { border-color: var(--secondary); background: var(--border); }
        .btn-sm svg { transition: all 0.2s ease; }

        /* Responsive Mobile Adjustments */
        @media (max-width: 768px) {
            #app { padding: 80px 16px 220px 16px; }
            #control-dock { padding: 16px; gap: 12px; }
            #nav-controls { gap: 16px; }
            .control-group { flex: 1 1 40%; } /* Make inputs grid-like */
            select, input[type="number"] { width: 100%; }
            .check-row { max-width: 100%; padding-bottom: 0; margin-top: 8px; }
            .btn-main { width: 100%; justify-content: center; }
        }
        
        @media (min-width: 769px) {
            .btn-main { min-width: 160px; }
        }
    </style>
</head>
<body>

<div id="top-bar">
    <div class="brand-title">VOICE IPSUM</div>
</div>

<div id="app">
    <div id="out" aria-live="polite"></div>
</div>

<div id="control-dock">
    <!-- Configuration Controls -->
    <div id="nav-controls">
        <div class="control-group">
            <label>Voice</label>
            <select id="voice">
                <option value="khaled">DJ Khaled</option>
                <option value="pirate" selected>Pirate</option>
                <option value="yoda">Yoda</option>
                <option value="chef">Furious chef</option>
                <option value="linkedin">LinkedIn guru</option>
                <option value="nature">Nature doc</option>
                <option value="sports">Sports commentator</option>
                <option value="noir">Noir detective</option>
                <option value="painter">Bob Ross</option>
            </select>
        </div>

        <div class="control-group">
            <label>Amount</label>
            <input id="n" type="number" min="1" max="50" value="1">
        </div>

        <div class="control-group">
            <label>Unit</label>
            <select id="unit">
                <option value="paragraphs" selected>Paragraphs</option>
                <option value="sentences">Sentences</option>
                <option value="words">Words</option>
            </select>
        </div>

        <label class="check-row" title="Start with the standard opener for this voice">
            <input id="start" type="checkbox" checked> 
            <span id="startlbl">Start with opener</span>
        </label>
    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="action-row">
        <!-- Copy Button -->
        <button id="copy" class="btn btn-sm" title="Copy to Clipboard (Ctrl+C)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
        </button>

        <!-- Generate Button -->
        <button id="gen" class="btn btn-main" title="Generate Text (Press Space)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            Generate
        </button>
    </div>
</div>

<script>
(function(){
  var V = {}, O = {};
  V.khaled = [
    "Another one.","Major key: keep your circle small and your vision loud.","They don’t want you to win, so we win twice.","Congratulations, you played yourself.","Bless up, and wake up before the sun does.","Watch your back, but never look back.","Cocoa butter on the skin, success in the stars.","We the best, always have been, always will be.","Hold the grind like a golden microphone.","Every closed door is a hallway to a bigger room.","The ocean is not the limit, it’s the warm-up.","Respect the process, then respect the trophy.","Stay loyal to the vision and the vision stays loyal to you.","The sun came up, so you have no excuse.","Tell the haters to take a seat, the show is about to start.","Another cloud, another blessing, another jet to catch.","Always have faith, always have clean sneakers.","Learn from the great ones, then become one.","A real one never leaves the studio without a plan.","Anything is possible when the beat is right.","Never fold, never fumble, never forget who you are.","Drink water, count blessings, send the text.","Success is a long hallway with many doors, so keep walking.","Fresh towel, fresh mind, fresh start.","Don’t play yourself, play the long game.","The road to the top has no traffic, they just don’t know the route.","Anointed, appointed, and a little ahead of schedule.","Rest is a major key, so respect the pillow.","Water the vision, shine the vision, announce the vision.","Let’s take a jet ski out and think about the next move.","Take the key, lock in, and don’t give it back.","Few will ask how you did it, so let the results talk first.","Smile, they’re watching, and they’re taking notes.","The secret is to love what you do, then do it again.","Real ones check on the family before they check the charts.","Keep the energy high and the group chat higher."
  ];
  O.khaled = "Another one.";

  V.pirate = [
    "Arr, hoist the colors and bring me the good rum.","The sea be a fickle mistress, but she pays in doubloons.","Ye scurvy dogs be swabbing the deck before the tide turns.","Shiver me timbers, there be a storm brewin’ off the port bow.","A map without an X is just a very sad piece of paper.","Every sailor knows the parrot hears more than the captain.","Fair winds and full barrels, me hearties.","Never trust a ship’s cook who won’t share the biscuits.","Aye, the treasure be buried where no honest soul would dig.","Batten the hatches, for the kraken be hungry tonight.","A captain’s word be worth less than a wet match, but his rum be worth a kingdom.","Lower the anchor, raise the mugs, and sing till the lanterns burn out.","The only thing worse than a mutiny be a mutiny with a long speech.","We sail at dawn, or whenever the captain finds his hat.","Beware the island that welcomes ye with free coconuts."
  ];
  O.pirate = "Arr, hoist the colors.";

  V.yoda = [
    "Patience, you must have, my young padawan.","Strong with the Force, this one is, but hungry for snacks, he also is.","Do or do not, there is no try, and no third option either.","Fear leads to anger, anger leads to meetings, meetings lead to suffering.","Much to learn, you still have, and a nap, you need.","Hmm, difficult to see, the future is, always in motion.","Small, the swamp is, but big, the lessons are.","Trust your feelings, you must, but check your email, you should.","Wise, the one who listens is. Wiser, the one who stops talking.","Clouded, your mind is. Clear it, a cup of tea will.","Strange, the path is, but walk it, you will.","Lost, the keys are, as always. In the Force, find them, you will not.","Begin, the training must, before the sun sets over Dagobah.","Patient, the river is, yet still it carves the mountain.","Listen to the old green one, you should, for seen things, he has."
  ];
  O.yoda = "Patience, you must have.";

  V.chef = [
    "Right, listen up, this chicken is so raw it’s still looking for its mother.","Where is the seasoning? It tastes like a hospital meal.","Stop. Look at me. Look at the plate. Now tell me that’s food.","This risotto is so thick I could lay bricks with it.","Wake up, the oven is not a decoration.","You’ve cooked this fish for so long, it’s filed for retirement.","Salt, acid, fat, heat. Four things. Four. And you’ve forgotten all of them.","Move, move, move, the pass is on fire and so am I.","Beautiful. Now do it again, but this time with feeling.","That’s not a sauce, it’s a cry for help.","Taste it. Taste it! And tell me you’d serve that to your gran.","The onions are crying, and frankly, so am I.","Clean station, clean mind, sharp knives, no excuses.","Gorgeous colour on that sear. Finally, something to be proud of.","Service in five minutes, and you’re still arguing with the parsley."
  ];
  O.chef = "Right, listen up.";

  V.linkedin = [
    "I’m humbled to announce that I have finished lunch.","Three years ago, I was just a guy with a laptop and a dream. Today, I’m a guy with two laptops.","Here’s what rejection taught me about leadership.","Agree? Let’s connect.","I’m not saying hustle is everything, but I wrote this at 4:30 a.m.","Thrilled to share that I’ve joined an incredible team of incredible people.","My intern taught me more about synergy than any MBA ever could.","Let that sink in.","Grateful for every mentor, every mistake, and every free coffee.","Culture eats strategy for breakfast, and I eat both before 6 a.m.","Here are 7 lessons I learned from a parking ticket.","Don’t just network, build meaningful relationships, then ask for a referral.","Growth mindset isn’t a slogan, it’s a Tuesday.","Be the change you want to see in the quarterly roadmap.","Reposting because this changed how I think about elevators."
  ];
  O.linkedin = "I’m humbled to announce something.";

  V.nature = [
    "And so, the journey begins.","In the hush of dawn, the herd gathers, unaware that it is being watched.","Here, at the edge of the water, patience is the only currency.","The female surveys the horizon, her instincts sharper than any map.","Against all odds, the young one takes its first unsteady steps.","Winter is coming, and with it, the long migration.","Silence. Then, a single rustle in the reeds.","For three weeks, he has not eaten. Tonight, everything changes.","Nothing here is wasted, nothing is wanted, and nothing is safe.","The sun climbs, and the heat shimmers across the plain like a held breath.","Rivals circle one another, each waiting for the other to blink.","It is a harsh world, but also, remarkably, a beautiful one.","Deep beneath the canopy, life carries on in quiet, vivid detail.","One mistake is all it takes. Fortunately, he makes several.","As night falls, the forest does not sleep. It merely changes shifts."
  ];
  O.nature = "And so, the journey begins.";

  V.sports = [
    "And we are underway, folks, what a night for it!","He’s got the ball, he’s got the space, he’s got absolutely everything but a plan!","Unbelievable scenes here, the crowd is on its feet!","That is a textbook pass, straight out of the coaching manual.","They’ll be disappointed with that, they’ll be very disappointed.","Ten seconds left, and the whole season comes down to this.","What a strike! The keeper never saw it, and honestly, neither did I.","He’s giving it a hundred and ten percent, and some of it is even legal.","The referee has blown, and nobody knows why, not even the referee.","This is a game of two halves, and one very confused mascot.","And it’s over! A result they’ll be talking about for years.","The momentum has shifted, you can feel it in the stands.","A tackle like that doesn’t show up on the stat sheet, but it shows up on the shin.","Replay confirms it, and the replay is also stunned.","The coach looks calm, but his clipboard says otherwise."
  ];
  O.sports = "And we are underway!";

  V.noir = [
    "The rain hadn’t stopped for three days, and neither had the trouble.","She walked in like a bad decision wearing a good coat.","Every city has its secrets. This one kept them in a drawer marked unpaid.","The neon sign buzzed like a fly that had given up on life.","I poured two fingers of whiskey and let the silence finish the story.","Nobody tells the truth in this town, but they lie beautifully.","The case was cold, but the coffee was colder.","A dame, a dead end, and a dollar short. That was my Tuesday.","The cigarette burned down to the filter, and so did my patience.","Trust is a coin with two heads, and both are lying.","Somewhere in the dark a saxophone cried, and I knew exactly how it felt.","The files on my desk smelled of old ink and older mistakes.","Footsteps echoed in the alley, always one step behind mine.","The mayor smiled the way a shark smiles at a swimmer.","I’d been double-crossed before, but never this politely."
  ];
  O.noir = "The rain hadn’t stopped for three days.";

  V.painter = [
    "Let’s just have a little fun today.","We’ll put a happy little cloud right up here, and he’ll live there forever.","There are no mistakes here, only happy little accidents.","Just tap the brush gently, like you’re waking up a sleeping bird.","Every mountain needs a friend, so we’ll give him another.","A little white, a little patience, and we’re in business.","Don’t be afraid to try, this is your world and you’re in charge.","We’ll add a tiny tree right over here, because he’s been feeling lonely.","Wash the brush, tap, tap, tap, and let all that old paint fall away.","A soft blue sky, a warm glow, and nothing in the world to worry about.","Nice and easy now, there’s no rush at all.","Maybe there’s a little river wandering through, going wherever it likes.","Shadows are just where the light takes a break.","Take a deep breath, and let the canvas do some of the work.","And just like that, we have a little cabin, and somebody’s probably making tea."
  ];
  O.painter = "Let’s just have a little fun today.";

  var bag = [], S = V.pirate; // Default matches HTML selection
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function next(){
    if (!bag.length) bag = shuffle(S.slice());
    return bag.pop();
  }
  function sentences(n){
    var out = [];
    for (var i = 0; i < n; i++) out.push(next());
    return out;
  }

  var $ = function(id){ return document.getElementById(id); };
  var out = $("out");

  function generate(){
    var n = Math.max(1, Math.min(50, parseInt($("n").value, 10) || 1));
    $("n").value = n;
    var unit = $("unit").value;
    var start = $("start").checked;
    var v = $("voice").value;
    if (S !== V[v]) { S = V[v]; bag = []; }
    var open = O[v];
    
    // Truncate long openers for the checkbox label
    var displayOpen = open.length > 25 ? open.substring(0, 22) + "..." : open;
    $("startlbl").textContent = "Start with “" + displayOpen + "”";
    
    var text = "";

    if (unit === "paragraphs") {
      var paras = [];
      for (var p = 0; p < n; p++) {
        var s = sentences(4 + Math.floor(Math.random() * 4));
        if (start && p === 0) s[0] = open;
        paras.push(s.join(" "));
      }
      text = paras.join("\n\n");
    } else if (unit === "sentences") {
      var ss = sentences(n);
      if (start) ss[0] = open;
      text = ss.join(" ");
    } else {
      var words = start ? open.split(" ") : [];
      while (words.length < n) words = words.concat(next().split(/\s+/));
      text = words.slice(0, n).join(" ").replace(/[.,;:!?]+$/, "") + ".";
    }
    out.textContent = text;
  }

  function copy(){
    var text = out.textContent;
    var btn = $("copy");
    var svg = btn.querySelector('svg');
    var originalHTML = svg.innerHTML;
    
    function done(){
      // Visual feedback: swap to checkmark and color green
      svg.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
      btn.style.color = "var(--accent-green)";
      btn.style.borderColor = "var(--accent-green)";
      
      setTimeout(function(){ 
        btn.style.color = ""; 
        btn.style.borderColor = "";
        svg.innerHTML = originalHTML;
      }, 1500);
    }
    
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  // Event Listeners
  $("gen").addEventListener("click", generate);
  $("copy").addEventListener("click", copy);
  ["voice", "n", "unit", "start"].forEach(function(id){
    $(id).addEventListener("change", generate);
  });

  // Keyboard Shortcuts (Space to generate, Ctrl/Cmd+C to copy)
  window.addEventListener('keydown', function(e) {
    // Don't trigger if user is typing in an input
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
    
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault(); // Prevent page scroll
      generate();
    }
  });
  
  // Initial generation
  generate();
})();
</script>
</body>
</html>
